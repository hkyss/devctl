name: Bug report
description: Something in devctl does not behave as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and what it did instead of what you expected.
      placeholder: |
        $ devctl up
        ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: devctl doctor
      description: Output of `devctl doctor --workspace`. Local Docker setups differ enough that reports without it are rarely actionable.
      render: text
    validations:
      required: true

  - type: textarea
    id: profile
    attributes:
      label: Project profile
      description: The `.devctl.json` involved, with anything sensitive removed.
      render: json
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: devctl version
      description: Output of `devctl --version`.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Host
      description: OS and Docker version, e.g. "macOS 15.3, Docker Desktop 4.38".
    validations:
      required: true
