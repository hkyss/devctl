[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devctl"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.0", "rich>=13", "prompt_toolkit>=3.0"]
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.scripts]
devctl = "devctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.unittest]
start-directory = "."
pattern = "test*.py"
